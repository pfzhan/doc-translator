<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="style.css">

<body class="book-view">
<header class="book-bar">
  <button type="button" class="btn ghost icon-btn" id="book-toc-toggle" aria-label="目录" aria-expanded="false">☰</button>
  <div class="book-title">
    <div class="book-name" id="book-name">正在打开…</div>
    <div class="book-meta" id="book-meta"></div>
  </div>
  <div class="book-nav">
    <button type="button" class="btn sm" id="book-prev">上一章</button>
    <button type="button" class="btn sm" id="book-next">下一章</button>
  </div>
</header>
<div class="book-body">
  <nav class="book-toc" id="book-toc" aria-label="目录"></nav>
  <main class="book-page">
    <iframe id="book-frame" title="书的内容"></iframe>
    <div class="book-error" id="book-error" hidden></div>
  </main>
</div>
<script src="epub.js"></script>
</body>
</html>
