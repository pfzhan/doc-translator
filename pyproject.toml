[project]
name = "doc-translator"
version = "0.1.0"
description = "Web app that translates EPUB, MOBI/AZW3, PDF and Markdown documents while keeping their layout"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "pfzhan", email = "pfzhan@apache.org" }]
requires-python = ">=3.12"
# Pinned versions live in requirements.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",    # FastAPI and dataclass defaults call functions on purpose
    "B905",    # zip() without strict= is intended where lengths may differ
    "SIM108",  # a ternary is not always clearer than if/else
    "SIM905",  # word lists read better as one string split on whitespace
    "SIM102",  # nested ifs often carry a comment on each condition
    "SIM103",  # an explicit return True/False reads better after a chain of checks
    "SIM105",  # try/except/pass is as clear as contextlib.suppress
    "SIM117",  # a nested with reads better when the inner context comes from the outer one
    "UP046",   # keep Generic[T]/TypeVar until the code moves to PEP 695 syntax as a whole
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest sets environment variables before importing the app
"eval/*" = ["E402"]   # scripts put the project directory on sys.path before importing it
# Closures defined in a loop are called within the same iteration
"app/formats/pdf_{restore,skip,biblio,units,write,write_geometry}.py" = ["B023"]
"eval/tools/gold.py" = ["B023"]
# Prompt texts are sent to the model as written; wrapping them would change the prompts
"app/{languages,prompts}.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
# New code must pass strict checking. The modules listed below were written before it and are checked leniently;
# remove a module from both lists once `mypy --strict` passes on it
strict = true
# pymupdf ships type information but leaves some constructors (Document, Rect, ...) unannotated
untyped_calls_exclude = [
    "pymupdf",
    "app.formats.pdf",
    "app.formats.pdf_algorithm_tables",
    "app.formats.pdf_align",
    "app.formats.pdf_biblio",
    "app.formats.pdf_blocks",
    "app.formats.pdf_columns",
    "app.formats.pdf_continuations",
    "app.formats.pdf_crop",
    "app.formats.pdf_dedupe",
    "app.formats.pdf_drawings",
    "app.formats.pdf_erase",
    "app.formats.pdf_extract",
    "app.formats.pdf_flow",
    "app.formats.pdf_formula_images",
    "app.formats.pdf_formula_runs",
    "app.formats.pdf_glosses",
    "app.formats.pdf_index_reflow",
    "app.formats.pdf_layout",
    "app.formats.pdf_math",
    "app.formats.pdf_merge",
    "app.formats.pdf_order",
    "app.formats.pdf_output",
    "app.formats.pdf_paragraphs",
    "app.formats.pdf_parts",
    "app.formats.pdf_place",
    "app.formats.pdf_place_formulas",
    "app.formats.pdf_rejoin",
    "app.formats.pdf_restore",
    "app.formats.pdf_roles",
    "app.formats.pdf_rows",
    "app.formats.pdf_runs",
    "app.formats.pdf_skip",
    "app.formats.pdf_split_lines",
    "app.formats.pdf_tables",
    "app.formats.pdf_type3",
    "app.formats.pdf_type3_glyphs",
    "app.formats.pdf_type3_lines",
    "app.formats.pdf_type3_ocr",
    "app.formats.pdf_type3_roles",
    "app.formats.pdf_unit_blocks",
    "app.formats.pdf_units",
    "app.formats.pdf_vision",
    "app.formats.pdf_write",
    "app.formats.pdf_write_geometry",
    "app.formats.pdf_write_rect",
]

[[tool.mypy.overrides]]
module = [
    "app.formats.pdf",
    "app.formats.pdf_algorithm_tables",
    "app.formats.pdf_align",
    "app.formats.pdf_biblio",
    "app.formats.pdf_blocks",
    "app.formats.pdf_columns",
    "app.formats.pdf_continuations",
    "app.formats.pdf_crop",
    "app.formats.pdf_dedupe",
    "app.formats.pdf_drawings",
    "app.formats.pdf_erase",
    "app.formats.pdf_extract",
    "app.formats.pdf_flow",
    "app.formats.pdf_formula_images",
    "app.formats.pdf_formula_runs",
    "app.formats.pdf_glosses",
    "app.formats.pdf_index_reflow",
    "app.formats.pdf_layout",
    "app.formats.pdf_math",
    "app.formats.pdf_merge",
    "app.formats.pdf_order",
    "app.formats.pdf_output",
    "app.formats.pdf_paragraphs",
    "app.formats.pdf_parts",
    "app.formats.pdf_place",
    "app.formats.pdf_place_formulas",
    "app.formats.pdf_rejoin",
    "app.formats.pdf_restore",
    "app.formats.pdf_roles",
    "app.formats.pdf_rows",
    "app.formats.pdf_runs",
    "app.formats.pdf_skip",
    "app.formats.pdf_split_lines",
    "app.formats.pdf_tables",
    "app.formats.pdf_type3",
    "app.formats.pdf_type3_glyphs",
    "app.formats.pdf_type3_lines",
    "app.formats.pdf_type3_ocr",
    "app.formats.pdf_type3_roles",
    "app.formats.pdf_unit_blocks",
    "app.formats.pdf_units",
    "app.formats.pdf_vision",
    "app.formats.pdf_write",
    "app.formats.pdf_write_geometry",
    "app.formats.pdf_write_rect",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Third-party packages without type information
module = ["py3langid.*", "mobi.*", "lxml.*", "onnxruntime.*"]
ignore_missing_imports = true
